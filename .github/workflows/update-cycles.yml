name: Update prices and rescan cycles

# Runs the whole cycle pipeline on GitHub's runners, which have the network
# access to reach Stooq and Yahoo. Everything it finds is committed back:
# the price files, the JSON the site reads, and a readable report.

on:
  schedule:
    # Saturday 07:13 UTC — after Friday's close everywhere, and off the hour
    # because GitHub throttles scheduled jobs hardest at :00 and :30.
    - cron: '13 7 * * 6'
  workflow_dispatch:
    inputs:
      symbol:
        description: 'One symbol for an extra ad-hoc test, e.g. ^DJI (blank to skip)'
        default: '^DJI'
      lag_years:
        description: 'Cycle length(s) for that test, e.g. 60 or 60,78.5'
        default: '60'
      window:
        description: 'Trading days compared in the ad-hoc test'
        default: '440'

permissions:
  contents: write

jobs:
  cycles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh daily closes
        # --full because the incremental path cannot grow a file backwards:
        # the S&P files written before the range=max fix start at 1970.
        run: python3 cycles/update_prices.py --full 2>&1 | tee /tmp/fetch.log

      - name: Run the analysis and write the report
        run: |
          SYMBOL="${{ inputs.symbol }}"
          LAGS="${{ inputs.lag_years || '60' }}"
          WINDOW="${{ inputs.window || '440' }}"
          {
            echo "# Cycle report"
            echo
            echo "Generated $(date -u '+%Y-%m-%d %H:%M UTC') from commit ${GITHUB_SHA:0:7}."
            echo
            echo '## Fetch log'
            echo
            echo '```'
            cat /tmp/fetch.log 2>/dev/null || echo '(no log)'
            echo '```'
            echo
            echo '## Price files'
            echo
            echo '| file | bars | from | to |'
            echo '| --- | --- | --- | --- |'
            for f in cycles/data/*.csv; do
              [ -e "$f" ] || continue
              n=$(( $(wc -l < "$f") - 1 ))
              first=$(sed -n '2p' "$f" | cut -d, -f1)
              last=$(tail -1 "$f" | cut -d, -f1)
              echo "| $(basename "$f") | $n | $first | $last |"
            done
          } > cycles/REPORT.md

          run_section () {   # $1 heading, rest = command
            local title="$1"; shift
            { echo; echo "## $title"; echo; echo '```'; } >> cycles/REPORT.md
            "$@" 2>&1 | tee -a cycles/REPORT.md
            echo '```' >> cycles/REPORT.md
          }

          run_section "Equity cycles — named offsets" \
            python3 cycles/find_cycles.py --symbol ^DJI --preset equities --window "$WINDOW"
          run_section "S&P 500 — named offsets" \
            python3 cycles/find_cycles.py --symbol ^GSPC --preset equities --window "$WINDOW"
          run_section "Crude oil — 17, 19.08, 27 years" \
            python3 cycles/find_cycles.py --symbol CL=F --preset crude --window 650
          run_section "Gold — 24.5 years" \
            python3 cycles/find_cycles.py --symbol GC=F --preset gold --window 1800 --epochs 4
          run_section "Open search, every market" \
            python3 cycles/find_cycles.py --all --min-years 3 --max-years 100 --top 5
          # Named-cycle overlays for the knowledge base, kept separate from the
          # open search so the articles can show the interval they discuss.
          run_section "Named-cycle overlays (equities)" \
            python3 cycles/find_cycles.py --symbol ^DJI --preset equities --window "$WINDOW" --json-suffix _named
          run_section "Named-cycle overlays (S&P)" \
            python3 cycles/find_cycles.py --symbol ^GSPC --preset sp500 --window "$WINDOW" --json-suffix _named
          run_section "Named-cycle overlays (crude)" \
            python3 cycles/find_cycles.py --symbol CL=F --preset crude --window 650 --json-suffix _named
          run_section "Named-cycle overlays (gold)" \
            python3 cycles/find_cycles.py --symbol GC=F --preset gold --window 1800 --epochs 4 --json-suffix _named
          # QQQ starts in 1999. 27.3 and 28 are out of reach until about 2028
          # and the script says so each week rather than reaching for a nearer
          # offset; they are carried anyway so the test starts the week it can.
          run_section "Named-cycle overlays (QQQ)" \
            python3 cycles/find_cycles.py --symbol QQQ --lag-years 4,6.8,11.65,22,27.3,28 --window "$WINDOW" --json-suffix _named
          # The Nasdaq hypotheses, named 2026-11-09 and re-scored from here:
          # 27.3 years is what the open search turned up at an 11-month window
          # (swing +0.58, worst epoch +0.19) and 28 is the course's own equity
          # clock a few weeks away from it. Neither cleared the controls on the
          # day it was named — that is the point of scoring them weekly from a
          # fixed starting line. See cycles/README.md.
          run_section "Named-cycle overlays (Nasdaq 100)" \
            python3 cycles/find_cycles.py --symbol ^NDX --lag-years 27.3,28 --window "$WINDOW" --epochs 5 --json-suffix _named
          # Tesla listed in 2010, so no preset applies: 60, 78.5 and even 22
          # need more history than exists. These three are the course's named
          # intervals that a 16-year record can actually reach.
          run_section "Named-cycle overlays (Tesla)" \
            python3 cycles/find_cycles.py --symbol TSLA --lag-years 4,6.8,11.65 --window "$WINDOW" --json-suffix _named
          # The only run that passes --allow-invert, and the script refuses it
          # anywhere else: US 30-year bonds are the one market the course shows
          # repeating upside down, and a sign flip doubles what an offset can
          # match against. 246 weeks is 4.72 years on a weekly chart.
          run_section "Named-cycle overlays (US 30-year bonds, inversion allowed)" \
            python3 cycles/find_cycles.py --symbol ZB=F --preset bonds --window 440 --allow-invert --json-suffix _named
          run_section "Composite — where the named cycles agree" \
            python3 cycles/composite.py --all --preset course --json
          run_section "Four-year election cycle" \
            python3 cycles/election_cycle.py --all --json

          if [ -n "$SYMBOL" ]; then
            run_section "Ad-hoc: $SYMBOL at $LAGS year(s), window $WINDOW" \
              python3 cycles/find_cycles.py --symbol "$SYMBOL" --lag-years "$LAGS" --window "$WINDOW"
          fi

      - name: Commit the data, the JSON and the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cycles/data public/cycles cycles/REPORT.md
          git diff --cached --quiet && echo "No change" && exit 0
          LAST=$(ls cycles/data/*.csv 2>/dev/null | head -1 | xargs -r tail -1 | cut -d, -f1)
          git commit -m "Update prices through ${LAST:-today} and rescan cycles"
          git push
